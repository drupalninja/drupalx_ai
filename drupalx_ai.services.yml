services:
  drupalx_ai.ai_service:
    class: Drupal\drupalx_ai\Service\AIService
    arguments: ['@config.factory', '@key.repository', '@file_system', '@logger.factory', '@drupalx_ai.validation_service', '@entity_type.bundle.info']

  drupalx_ai.entity_save_service:
    class: Drupal\drupalx_ai\Service\EntitySaveService
    arguments: ['@entity_type.manager', '@logger.factory', '@file_system', '@current_user', '@entity_type.bundle.info', '@entity_field.manager']

  drupalx_ai.validation_service:
    class: Drupal\drupalx_ai\Service\ValidationService
    arguments: ['@module_handler', '@entity_type.bundle.info', '@logger.factory']
