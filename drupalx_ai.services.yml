services:
  drupalx_ai.ai_service:
    class: Drupal\drupalx_ai\Service\AIService
    arguments: ['@config.factory', '@key.repository', '@file_system', '@logger.factory', '@drupalx_ai.validation_service', '@entity_type.bundle.info', '@drupalx_ai.entity_save_service']

  drupalx_ai.entity_save_service:
    class: Drupal\drupalx_ai\Service\EntitySaveService
    arguments: ['@entity_type.manager', '@logger.factory', '@drupalx_ai.paragraph_service', '@drupalx_ai.media_service', '@drupalx_ai.taxonomy_service', '@drupalx_ai.file_service']

  drupalx_ai.paragraph_service:
    class: Drupal\drupalx_ai\Service\ParagraphService
    arguments: ['@entity_type.manager', '@logger.factory', '@current_user', '@entity_type.bundle.info', '@entity_field.manager', '@drupalx_ai.media_service', '@drupalx_ai.taxonomy_service']

  drupalx_ai.media_service:
    class: Drupal\drupalx_ai\Service\MediaService
    arguments: ['@entity_type.manager', '@logger.factory', '@file_system', '@current_user', '@entity_type.bundle.info', '@drupalx_ai.file_service']

  drupalx_ai.taxonomy_service:
    class: Drupal\drupalx_ai\Service\TaxonomyService
    arguments: ['@entity_type.manager', '@logger.factory', '@current_user']

  drupalx_ai.file_service:
    class: Drupal\drupalx_ai\Service\FileService
    arguments: ['@entity_type.manager', '@logger.factory', '@file_system', '@current_user']

  drupalx_ai.validation_service:
    class: Drupal\drupalx_ai\Service\ValidationService
    arguments: ['@module_handler', '@entity_type.bundle.info', '@logger.factory']
