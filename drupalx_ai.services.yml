# Main services.yml file
services:
  drupalx_ai.ai_model_api:
    class: \Drupal\drupalx_ai\Service\AiModelApiService
    arguments: ['@http_client_factory', '@config.factory', '@logger.factory']

  drupalx_ai.paragraph_structure:
    class: \Drupal\drupalx_ai\Service\ParagraphStructureService
    arguments: ['@entity_type.manager', '@entity_field.manager']

  drupalx_ai.mock_landing_page:
    class: \Drupal\drupalx_ai\Service\MockLandingPageService
    arguments:
      - '@entity_type.manager'
      - '@file_system'
      - '@http_client'
      - '@logger.factory'
      - '@drupalx_ai.paragraph_structure'
      - '@config.factory'
      - '@module_handler'

  drupalx_ai.ai_landing_page_service:
    class: \Drupal\drupalx_ai\Service\AiLandingPageService
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@drupalx_ai.mock_landing_page'
      - '@drupalx_ai.ai_model_api'
      - '@drupalx_ai.paragraph_structure'
      - '@config.factory'
